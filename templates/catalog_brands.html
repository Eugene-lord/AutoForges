{% extends 'base.html' %}
{% block title %}Каталог автомобилей{% endblock %}
{% block content %}
<h2 class="mb-4 text-light">Марки автомобилей</h2>
<div class="row">
    {% for brand in brands %}
    <div class="col-md-4 mb-4">
        <a href="{{ url_for('catalog.model_list', brand_id=brand.id) }}" class="text-decoration-none">
            <div class="glass-card p-4 text-center h-100">
                <h4>{{ brand.name }}</h4>
                <p class="text-muted small">{{ brand.country }}</p>
                <p class="text-light small">{{ brand.description }}</p>
            </div>
        </a>
    </div>
    {% endfor %}
</div>
{% endblock %}
