{% extends 'base.html' %}
{% block title %}Страница не найдена — AutoForge{% endblock %}
{% block content %}
<div class="text-center py-5">
    <h1 class="display-1 text-warning">404</h1>
    <h3 class="text-light">Страница не найдена</h3>
    <p class="text-muted">Возможно, вы ошиблись адресом или страница была удалена.</p>
    <a href="{{ url_for('main.index') }}" class="btn btn-glow mt-3">Вернуться на главную</a>
</div>
{% endblock %}
