{% extends 'base.html' %}
{% block title %}Регистрация — AUTOFORGE{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="glass-card p-4">
            <h2 class="text-light mb-4">Регистрация</h2>
            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="mb-3">
                    <label for="username" class="form-label text-light">Имя пользователя</label>
                    <input type="text" class="form-control bg-dark text-light border-secondary" id="username" name="username" required>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label text-light">Email</label>
                    <input type="email" class="form-control bg-dark text-light border-secondary" id="email" name="email" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label text-light">Пароль</label>
                    <input type="password" class="form-control bg-dark text-light border-secondary" id="password" name="password" required>
                </div>
                <button type="submit" class="btn btn-glow w-100">Зарегистрироваться</button>
            </form>
            <div class="mt-3 text-center">
                <small class="text-muted">Уже есть аккаунт? <a href="{{ url_for('auth.login') }}">Войти</a></small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
