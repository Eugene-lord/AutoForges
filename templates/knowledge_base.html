{% extends 'base.html' %}
{% block title %}База знаний{% endblock %}
{% block content %}
<h2 class="text-light mb-4">База знаний</h2>
{% if categories %}
    <div class="row">
        {% for cat in categories %}
        <div class="col-md-4 mb-4">
            <a href="{{ url_for('knowledge.category', category=cat) }}" class="text-decoration-none">
                <div class="glass-card p-4 text-center">
                    <h5 class="text-warning">{{ cat }}</h5>
                    <p class="text-muted small">Смотреть статьи</p>
                </div>
            </a>
        </div>
        {% endfor %}
    </div>
{% else %}
    <p class="text-muted">Пока нет статей.</p>
{% endif %}
{% endblock %}
