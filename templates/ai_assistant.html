{% extends 'base.html' %}
{% block title %}ИИ-помощник{% endblock %}
{% block content %}
<h2 class="text-light mb-4">🤖 ИИ-помощник (DeepSeek)</h2>
<div class="glass-card p-4 mb-4">
    <form method="POST">
        <div class="mb-3">
            <label for="question" class="form-label text-light">Ваш вопрос</label>
            <textarea class="form-control bg-dark text-light border-secondary" id="question" name="question" rows="3" placeholder="Например: какой двигатель лучше для BMW E46?">{{ question or '' }}</textarea>
        </div>
        <button type="submit" class="btn btn-glow">Спросить</button>
    </form>
</div>
{% if answer %}
    <div class="glass-card p-4">
        <h5 class="text-warning">Ответ:</h5>
        <div class="text-light" style="white-space: pre-line;">{{ answer }}</div>
    </div>
{% endif %}
{% endblock %}
