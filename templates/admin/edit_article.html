{% extends 'admin/base_admin.html' %}
{% block admin_content %}
<h2 class="text-light mb-3">{% if item %}Редактировать{% else %}Добавить{% endif %} статью</h2>
<form method="POST">
    <div class="mb-3">
        <label class="form-label text-light">Заголовок</label>
        <input type="text" name="title" class="form-control bg-dark text-light" value="{{ item.title if item else '' }}" required>
    </div>
    <div class="mb-3">
        <label class="form-label text-light">Категория</label>
        <input type="text" name="category" class="form-control bg-dark text-light" value="{{ item.category if item else '' }}">
    </div>
    <div class="mb-3">
        <label class="form-label text-light">Содержание</label>
        <textarea name="content" class="form-control bg-dark text-light" rows="10" required>{{ item.content if item else '' }}</textarea>
    </div>
    <div class="mb-3">
        <label class="form-label text-light">Теги (через запятую)</label>
        <input type="text" name="tags" class="form-control bg-dark text-light" value="{{ item.tags if item else '' }}">
    </div>
    <button type="submit" class="btn btn-glow">Сохранить</button>
    <a href="{{ url_for('admin.list_articles') }}" class="btn btn-outline-light">Отмена</a>
</form>
{% endblock %}
