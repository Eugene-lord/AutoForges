{% extends 'admin/base_admin.html' %}
{% block admin_content %}
<h2 class="text-light mb-3">Двигатели</h2>
<a href="{{ url_for('admin.new_engine') }}" class="btn btn-glow btn-sm mb-3">+ Добавить</a>
<table class="table table-dark table-striped">
    <thead>
        <tr><th>ID</th><th>Код</th><th>Название</th><th>Объём</th><th>Мощность</th><th>Действия</th></tr>
    </thead>
    <tbody>
        {% for item in items %}
        <tr>
            <td>{{ item.id }}</td>
            <td>{{ item.engine_code }}</td>
            <td>{{ item.name }}</td>
            <td>{{ item.displacement }}</td>
            <td>{{ item.power_hp }}</td>
            <td>
                <a href="{{ url_for('admin.edit_engine', id=item.id) }}" class="btn btn-outline-light btn-sm">✏️</a>
                <form action="{{ url_for('admin.delete_engine', id=item.id) }}" method="POST" style="display:inline">
                    <button type="submit" class="btn btn-outline-danger btn-sm">🗑️</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
