{% extends 'admin/base_admin.html' %}
{% block admin_content %}
<h2 class="text-light mb-3">{% if item %}Редактировать{% else %}Добавить{% endif %} электромотор</h2>
<form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3">
        <label class="form-label text-light">Название</label>
        <input type="text" name="name" class="form-control bg-dark text-light" value="{{ item.name if item else '' }}" required>
    </div>
    <div class="row">
        <div class="col mb-3">
            <label class="form-label text-light">Мощность (л.с.)</label>
            <input type="number" name="power_hp" class="form-control bg-dark text-light" value="{{ item.power_hp if item else '' }}">
        </div>
        <div class="col mb-3">
            <label class="form-label text-light">Крутящий момент (Нм)</label>
            <input type="number" name="torque_nm" class="form-control bg-dark text-light" value="{{ item.torque_nm if item else '' }}">
        </div>
    </div>
    <div class="mb-3">
        <label class="form-label text-light">Тип двигателя</label>
        <input type="text" name="motor_type" class="form-control bg-dark text-light" value="{{ item.motor_type if item else '' }}">
    </div>
    <button type="submit" class="btn btn-glow">Сохранить</button>
    <a href="{{ url_for('admin.list_electric_motors') }}" class="btn btn-outline-light">Отмена</a>
</form>
{% endblock %}
