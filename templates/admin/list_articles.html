{% extends 'admin/base_admin.html' %}
{% block admin_content %}
<h2 class="text-light mb-3">Статьи</h2>
<a href="{{ url_for('admin.new_article') }}" class="btn btn-glow btn-sm mb-3">+ Добавить</a>
<table class="table table-dark table-striped">
    <thead>
        <tr><th>ID</th><th>Заголовок</th><th>Категория</th><th>Теги</th><th>Действия</th></tr>
    </thead>
    <tbody>
        {% for item in items %}
        <tr>
            <td>{{ item.id }}</td>
            <td>{{ item.title }}</td>
            <td>{{ item.category }}</td>
            <td>{{ item.tags }}</td>
            <td>
                <a href="{{ url_for('admin.edit_article', id=item.id) }}" class="btn btn-outline-light btn-sm">✏️</a>
                <form action="{{ url_for('admin.delete_article', id=item.id) }}" method="POST" style="display:inline">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <button type="submit" class="btn btn-outline-danger btn-sm">🗑️</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
