{% extends 'admin/base_admin.html' %}
{% block admin_content %}
<h2 class="text-light mb-3">{% if item %}Редактировать{% else %}Добавить{% endif %} батарею</h2>
<form method="POST">
    <div class="mb-3">
        <label class="form-label text-light">Название</label>
        <input type="text" name="name" class="form-control bg-dark text-light" value="{{ item.name if item else '' }}" required>
    </div>
    <div class="row">
        <div class="col mb-3">
            <label class="form-label text-light">Ёмкость (кВт⋅ч)</label>
            <input type="number" step="0.1" name="capacity_kwh" class="form-control bg-dark text-light" value="{{ item.capacity_kwh if item else '' }}">
        </div>
        <div class="col mb-3">
            <label class="form-label text-light">Напряжение (В)</label>
            <input type="number" step="0.1" name="voltage" class="form-control bg-dark text-light" value="{{ item.voltage if item else '' }}">
        </div>
    </div>
    <div class="mb-3">
        <label class="form-label text-light">Тип батареи</label>
        <input type="text" name="battery_type" class="form-control bg-dark text-light" value="{{ item.battery_type if item else '' }}">
    </div>
    <button type="submit" class="btn btn-glow">Сохранить</button>
    <a href="{{ url_for('admin.list_batteries') }}" class="btn btn-outline-light">Отмена</a>
</form>
{% endblock %}
