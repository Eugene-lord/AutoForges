{% extends 'admin/base_admin.html' %}
{% block admin_content %}
<h2 class="text-light mb-3">{% if item %}Редактировать{% else %}Добавить{% endif %} двигатель</h2>
<form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3">
        <label class="form-label text-light">Код двигателя</label>
        <input type="text" name="engine_code" class="form-control bg-dark text-light" value="{{ item.engine_code if item else '' }}" required>
    </div>
    <div class="mb-3">
        <label class="form-label text-light">Название</label>
        <input type="text" name="name" class="form-control bg-dark text-light" value="{{ item.name if item else '' }}" required>
    </div>
    <div class="row">
        <div class="col mb-3">
            <label class="form-label text-light">Объём (л)</label>
            <input type="number" step="0.1" name="displacement" class="form-control bg-dark text-light" value="{{ item.displacement if item else '' }}">
        </div>
        <div class="col mb-3">
            <label class="form-label text-light">Мощность (л.с.)</label>
            <input type="number" name="power_hp" class="form-control bg-dark text-light" value="{{ item.power_hp if item else '' }}">
        </div>
        <div class="col mb-3">
            <label class="form-label text-light">Крутящий момент (Нм)</label>
            <input type="number" name="torque_nm" class="form-control bg-dark text-light" value="{{ item.torque_nm if item else '' }}">
        </div>
    </div>
    <div class="mb-3">
        <label class="form-label text-light">Топливо</label>
        <input type="text" name="fuel_type" class="form-control bg-dark text-light" value="{{ item.fuel_type if item else '' }}">
    </div>
    <div class="mb-3">
        <label class="form-label text-light">Конфигурация</label>
        <input type="text" name="configuration" class="form-control bg-dark text-light" value="{{ item.configuration if item else '' }}">
    </div>
    <div class="mb-3">
        <label class="form-label text-light">Родная модель (опционально)</label>
        <select name="model_id" class="form-select bg-dark text-light">
            <option value="">-- Не привязан --</option>
            {% for m in models %}
                <option value="{{ m.id }}" {% if item and item.model_id == m.id %}selected{% endif %}>{{ m.brand.name }} {{ m.name }} ({{ m.generation }})</option>
            {% endfor %}
        </select>
    </div>
    <button type="submit" class="btn btn-glow">Сохранить</button>
    <a href="{{ url_for('admin.list_engines') }}" class="btn btn-outline-light">Отмена</a>
</form>
{% endblock %}
